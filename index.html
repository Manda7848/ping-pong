<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ping Pong Ultra Difficult Pro Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: blueviolet; /* Changed background color */
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif; /* Set Orbitron as default font */
        }
        canvas {
            display: block;
            margin: 40px auto;
            background: #111;
            border: 2px solid #fff;
        }
        h1 {
            color: #fff;
            text-align: center;
            font-family: 'Orbitron', sans-serif; /* Ensure h1 uses Orbitron */
        }
    </style>
</head>
<body>
    <h1>Ping Pong Ultra Difficult Pro Max</h1>
    <canvas id="pong" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        // Paddle
        const paddleWidth = 10, paddleHeight = 80;
        let leftY = 160, rightY = 160;
        const playerPaddleSpeed = 8; // Increased speed for player control
        const aiPaddleSpeed = 5;    // AI paddle speed remains

        // Ball
        let ballX = 300, ballY = 200, ballSize = 10;
        let ballSpeedX = 4, ballSpeedY = 4;

        // Scores
        let leftScore = 0, rightScore = 0;

        // Game State Flags and Message
        let gameOver = false;
        let finalMessage = ""; // To store the message to display

        // Player Control Flags
        let leftPaddleUp = false;
        let leftPaddleDown = false;

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawText(text, x, y) {
            ctx.fillStyle = "#fff";
            ctx.font = "32px 'Orbitron', sans-serif"; // Ensure scores use Orbitron
            ctx.fillText(text, x, y);
        }

        function resetBall() {
            ballX = 300;
            ballY = 200;
            ballSpeedX = -ballSpeedX;
            ballSpeedY = 4 * (Math.random() > 0.5 ? 1 : -1);
        }

        function endGame(winner) {
            gameOver = true;
            if (winner === "human") {
                finalMessage = "Congrats! You triumphed over the ultra difficult pro max AI!\nHere you go, you ultimate grass untoucher ping pong player!";
            } else { // winner === "ai"
                finalMessage = "AI Dominates! You dared to challenge, and you fell.\nPerhaps touch some grass?";
            }
        }

        function draw() {
            // Always draw base game elements first
            drawRect(0, 0, 600, 400, "#111"); // Clear background
            // Net
            for (let i = 0; i < 400; i += 20)
                drawRect(295, i, 10, 10, "#fff");
            // Paddles
            drawRect(10, leftY, paddleWidth, paddleHeight, "#fff");
            drawRect(580, rightY, paddleWidth, paddleHeight, "#fff");
            // Ball
            drawCircle(ballX, ballY, ballSize, "#fff");
            // Scores
            drawText(leftScore, 150, 50);
            drawText(rightScore, 430, 50);

            // Draw final message and its background LAST, so it's on top
            if (gameOver) {
                // Calculate dimensions for the black background rectangle
                const msgFontSize = 24;
                const lineHeight = 30; // Based on your previous calculation
                const lines = finalMessage.split('\n');
                const textHeight = lines.length * lineHeight;
                const padding = 20;

                // Adjust text alignment temporarily to measure width
                ctx.font = `${msgFontSize}px 'Orbitron', sans-serif`;
                ctx.textAlign = "center";
                let maxWidth = 0;
                for (const line of lines) {
                    const currentWidth = ctx.measureText(line).width;
                    if (currentWidth > maxWidth) {
                        maxWidth = currentWidth;
                    }
                }

                const rectWidth = maxWidth + padding * 2;
                const rectHeight = textHeight + padding;
                const rectX = (canvas.width / 2) - (rectWidth / 2);
                const rectY = (canvas.height / 2) - (rectHeight / 2);

                // Draw black background rectangle
                drawRect(rectX, rectY, rectWidth, rectHeight, "rgba(0, 0, 0, 0.9)"); // Semi-transparent black

                // Draw the text
                ctx.fillStyle = "#fff";
                for (let i = 0; i < lines.length; i++) {
                    ctx.fillText(lines[i], canvas.width / 2, rectY + padding + (i * lineHeight));
                }
            }
        }

        function update() {
            // Stop updating game state if game is over
            if (gameOver) return;

            // Player paddle movement
            if (leftPaddleUp && leftY > 0) {
                leftY -= playerPaddleSpeed;
            }
            if (leftPaddleDown && leftY + paddleHeight < 400) {
                leftY += playerPaddleSpeed;
            }

            // Ball movement
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Collisions with top/bottom
            if (ballY + ballSize > 400 || ballY - ballSize < 0)
                ballSpeedY = -ballSpeedY;

            // Left paddle collision
            if (ballX - ballSize < 20 && ballY > leftY && ballY < leftY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }
            // Right paddle collision
            if (ballX + ballSize > 580 && ballY > rightY && ballY < rightY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }

            // Score left (AI scores)
            if (ballX - ballSize < 0) {
                rightScore++;
                // Console message for AI points
                console.log(`Oh no! The AI has bested you a total of ${rightScore} times!`);
                if (rightScore === 20) {
                    endGame("ai"); // AI wins
                } else {
                    resetBall();
                }
            }
            // Score right (Human scores)
            if (ballX + ballSize > 600) {
                leftScore++;
                // Console message for Human points (optional, but good symmetry)
                console.log(`Yes! You scored! Your total: ${leftScore}. Keep fighting!`);
                if (leftScore === 20) {
                    endGame("human"); // Human wins
                } else {
                    resetBall();
                }
            }

            // AI for right paddle
            if (ballY > rightY + paddleHeight / 2 && rightY + paddleHeight < 400)
                rightY += aiPaddleSpeed;
            else if (ballY < rightY + paddleHeight / 2 && rightY > 0)
                rightY -= aiPaddleSpeed;
        }

        // Controls for left paddle (W/S)
        window.addEventListener('keydown', function(e) {
            if (e.key === 'w') leftPaddleUp = true;
            if (e.key === 's') leftPaddleDown = true;
        });

        window.addEventListener('keyup', function(e) {
            if (e.key === 'w') leftPaddleUp = false;
            if (e.key === 's') leftPaddleDown = false;
        });


        function game() {
            update();
            draw();
            requestAnimationFrame(game);
        }

        game();
    </script>
</body>
</html>
