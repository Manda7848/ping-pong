<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pong Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: blueviolet; /* Changed background color */
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif; /* Set Orbitron as default font */
        }
        canvas {
            display: block;
            margin: 40px auto;
            background: #111;
            border: 2px solid #fff;
        }
        h1 {
            color: #fff;
            text-align: center;
            font-family: 'Orbitron', sans-serif; /* Ensure h1 uses Orbitron */
        }
    </style>
</head>
<body>
    <h1>Pong Game</h1>
    <canvas id="pong" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        // Paddle
        const paddleWidth = 10, paddleHeight = 80;
        let leftY = 160, rightY = 160;
        const playerPaddleSpeed = 8; // Increased speed for player control
        const aiPaddleSpeed = 5;    // AI paddle speed remains

        // Ball
        let ballX = 300, ballY = 200, ballSize = 10;
        let ballSpeedX = 4, ballSpeedY = 4;

        // Scores
        let leftScore = 0, rightScore = 0;

        // Player Control Flags
        let leftPaddleUp = false;
        let leftPaddleDown = false;

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawText(text, x, y) {
            ctx.fillStyle = "#fff";
            ctx.font = "32px 'Orbitron', sans-serif"; // Ensure scores use Orbitron
            ctx.fillText(text, x, y);
        }

        function resetBall() {
            ballX = 300;
            ballY = 200;
            ballSpeedX = -ballSpeedX;
            ballSpeedY = 4 * (Math.random() > 0.5 ? 1 : -1);
        }

        function draw() {
            // Clear
            drawRect(0, 0, 600, 400, "#111");
            // Net
            for (let i = 0; i < 400; i += 20)
                drawRect(295, i, 10, 10, "#fff");
            // Paddles
            drawRect(10, leftY, paddleWidth, paddleHeight, "#fff");
            drawRect(580, rightY, paddleWidth, paddleHeight, "#fff");
            // Ball
            drawCircle(ballX, ballY, ballSize, "#fff");
            // Scores
            drawText(leftScore, 150, 50);
            drawText(rightScore, 430, 50);
        }

        function update() {
            // Player paddle movement
            if (leftPaddleUp && leftY > 0) {
                leftY -= playerPaddleSpeed;
            }
            if (leftPaddleDown && leftY + paddleHeight < 400) {
                leftY += playerPaddleSpeed;
            }

            // Ball movement
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Collisions with top/bottom
            if (ballY + ballSize > 400 || ballY - ballSize < 0)
                ballSpeedY = -ballSpeedY;

            // Left paddle collision
            if (ballX - ballSize < 20 && ballY > leftY && ballY < leftY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }
            // Right paddle collision
            if (ballX + ballSize > 580 && ballY > rightY && ballY < rightY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }

            // Score left
            if (ballX - ballSize < 0) {
                rightScore++;
                resetBall();
            }
            // Score right
            if (ballX + ballSize > 600) {
                leftScore++;
                resetBall();
            }

            // AI for right paddle
            if (ballY > rightY + paddleHeight / 2 && rightY + paddleHeight < 400)
                rightY += aiPaddleSpeed;
            else if (ballY < rightY + paddleHeight / 2 && rightY > 0)
                rightY -= aiPaddleSpeed;
        }

        // Controls for left paddle (W/S)
        window.addEventListener('keydown', function(e) {
            if (e.key === 'w') leftPaddleUp = true;
            if (e.key === 's') leftPaddleDown = true;
        });

        window.addEventListener('keyup', function(e) {
            if (e.key === 'w') leftPaddleUp = false;
            if (e.key === 's') leftPaddleDown = false;
        });


        function game() {
            update();
            draw();
            requestAnimationFrame(game);
        }

        game();
    </script>
</body>
</html>
